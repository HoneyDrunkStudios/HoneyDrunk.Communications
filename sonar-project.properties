# SonarQube Cloud project configuration for HoneyDrunk.Communications.
# Project imported via the SonarQube Cloud GitHub App; quality gate runs in
# job-sonarcloud.yml (HoneyDrunk.Actions) on every PR and push to main.
#
# This file lives at the repo root next to HoneyDrunk.Communications.slnx —
# Communications's pr.yml runs the reusable workflow with working-directory: '.'
# so this is where the scanner discovers project configuration.

sonar.organization=honeydrunkstudios
sonar.projectKey=honeydrunkstudios_HoneyDrunk.Communications
sonar.projectName=HoneyDrunk.Communications

# Sources / tests — repo uses the src/ + tests/ split
sonar.sources=src
sonar.tests=tests

# Coverage (consumed by job-sonarcloud.yml after Cobertura → OpenCover conversion)
sonar.cs.opencover.reportsPaths=**/coverage.opencover.xml

# Exclusions — generated code and build outputs
sonar.exclusions=**/obj/**,**/bin/**,**/*.Designer.cs

# Coverage exclusions — Abstractions packages contain interfaces only
sonar.coverage.exclusions=**/src/HoneyDrunk.Communications.Abstractions/**

# New Code definition — inherits from organization default (30 days)
