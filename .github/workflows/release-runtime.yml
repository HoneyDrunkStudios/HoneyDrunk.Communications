name: Release Runtime

on:
  push:
    tags:
      - 'runtime-v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (for example, 0.3.0)'
        required: true
        type: string

permissions: {}

jobs:
  prepare:
    name: Prepare Release
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      version: ${{ steps.get_version.outputs.version }}
      version_tag: ${{ steps.get_version.outputs.version_tag }}
    steps:
      - name: Determine version
        id: get_version
        shell: bash
        env:
          WORKFLOW_DISPATCH_VERSION: ${{ github.event.inputs.version }}
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            VERSION="$WORKFLOW_DISPATCH_VERSION"
            VERSION_TAG="runtime-v${VERSION}"
          else
            VERSION="${GITHUB_REF#refs/tags/runtime-v}"
            VERSION_TAG="${GITHUB_REF#refs/tags/}"
          fi
          if [[ ! "$VERSION" =~ ^(0|[1-9][0-9]*)[.](0|[1-9][0-9]*)[.](0|[1-9][0-9]*)(-((0|[1-9][0-9]*)|[0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*)([.]((0|[1-9][0-9]*)|[0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*))*)?$ ]]; then
            echo "::error::Version must be a NuGet package version without build metadata (for example 1.2.3 or 1.2.3-preview.1)."
            exit 1
          fi
          printf 'version=%s\n' "$VERSION" >>"$GITHUB_OUTPUT"
          printf 'version_tag=%s\n' "$VERSION_TAG" >>"$GITHUB_OUTPUT"
          echo "Publishing HoneyDrunk.Communications version: $VERSION"

  release:
    name: Build, Pack & Publish Runtime
    needs: prepare
    permissions:
      contents: write
      packages: write
      id-token: write
      security-events: write
    uses: HoneyDrunkStudios/HoneyDrunk.Actions/.github/workflows/release.yml@main
    with:
      dotnet-version: '10.0.x'
      configuration: 'Release'
      runs-on: 'ubuntu-latest'
      project-path: 'src/HoneyDrunk.Communications/HoneyDrunk.Communications.csproj'
      package-version: ${{ needs.prepare.outputs.version }}
      enable-nuget-publish: true
      nuget-source: 'https://api.nuget.org/v3/index.json'
      create-github-release: true
      github-release-tag: ${{ needs.prepare.outputs.version_tag }}
      release-product-name: HoneyDrunk.Communications
      release-nuget-packages: |
        HoneyDrunk.Communications
      release-docs-url: 'https://github.com/HoneyDrunkStudios/HoneyDrunk.Communications#readme'
      actions-ref: 'main'
    secrets:
      nuget-api-key: ${{ secrets.NUGET_API_KEY }}
